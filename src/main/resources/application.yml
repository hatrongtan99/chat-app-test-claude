# yaml-language-server: $schema=
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chatapp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:chatuser}
    password: ${DB_PASSWORD:chatpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-minimum-32-chars-changeme}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}"
  rate-limit:
    auth-max-requests: ${RATE_LIMIT_AUTH_MAX:5}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}
  sql-trace:
    enabled: ${SQL_TRACE_ENABLED:true}

logging:
  level:
    com.chatapp: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
